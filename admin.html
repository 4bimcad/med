<!DOCTYPE html>
<html lang="de-DE" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin | FortbildungMed.de</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
  <link rel="manifest" href="assets/img/favicons/manifest.json">
  <meta name="theme-color" content="#ffffff">

  <link href="assets/css/theme.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
  <main class="main" id="top">

    <nav class="navbar navbar-expand-lg navbar-light fixed-top py-3">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img class="img-fluid" src="assets/img/icons/logo.png" alt="FortbildungMed.de Logo" />
        </a>
        <span class="fw-bold text-600">Admin-Bereich</span>
      </div>
    </nav>

    <section class="pt-8 pb-5">
      <div class="container pt-5 pt-md-6">

        <div id="admin-denied" class="alert alert-danger d-none">
          Kein Zugriff. Dieser Bereich ist nur für Administratoren.
        </div>

        <div id="admin-content" class="d-none">
          <h1 class="fw-bold mb-4">Admin-Panel</h1>

          <div class="row g-4">
            <!-- Nutzer suchen -->
            <div class="col-lg-4">
              <div class="card p-3 shadow-sm">
                <h5 class="fw-bold mb-3">Nutzer suchen</h5>
                <div class="input-group mb-3">
                  <input type="email" class="form-control" id="user-search-input" placeholder="E-Mail-Adresse …">
                  <button class="btn btn-primary" id="user-search-btn" type="button">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
                <div class="list-group" id="user-search-results"></div>
              </div>
            </div>

            <!-- Ausgewählter Nutzer -->
            <div class="col-lg-8">
              <div id="selected-user-panel" class="d-none">

                <div class="card p-4 mb-4">
                  <h5 class="fw-bold mb-0" id="selected-user-name"></h5>
                  <div class="small text-600 mb-3" id="selected-user-email"></div>

                  <hr>

                  <h6 class="fw-bold mb-2">Zahlung manuell vermerken</h6>
                  <div id="enroll-alert" class="alert d-none" role="alert"></div>
                  <div class="row g-2 align-items-end mb-2">
                    <div class="col-md-7">
                      <label class="form-label small">Kurs</label>
                      <select class="form-select" id="enroll-course-select">
                        <option value="">Kurs wählen …</option>
                      </select>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label small">Bezahlt (€)</label>
                      <input type="number" step="0.01" class="form-control" id="enroll-price-paid">
                    </div>
                    <div class="col-md-2">
                      <button type="button" class="btn btn-primary w-100 rounded-pill" id="enroll-btn">Anlegen</button>
                    </div>
                  </div>
                </div>

                <div class="card p-4 mb-4">
                  <h6 class="fw-bold mb-3">Kurse des Nutzers</h6>
                  <div id="enrollments-list"></div>
                </div>

                <div class="card p-4">
                  <h6 class="fw-bold mb-3">Zertifikate des Nutzers</h6>
                  <div id="certificates-list"></div>
                </div>

              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="vendors/@popperjs/popper.min.js"></script>
  <script src="vendors/bootstrap/bootstrap.min.js"></script>
  <script src="assets/js/theme.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/qrcode-lib.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
